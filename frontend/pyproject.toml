[project]
name = "submission-frontend"
version = "0.1.0"
description = "Manager Dashboard for Human-in-the-Loop Expense Review"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-adk[gcp]>=2.9.2",
    "google-cloud-aiplatform>=1.156.0",
    "requests>=2.31.0",
    "google-auth>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]
